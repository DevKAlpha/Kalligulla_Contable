# Production-like run: docker compose up --build -d  ->  http://localhost:8080
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaligula-web
    ports:
      - "8080:3000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    security_opt:
      - no-new-privileges:true
